<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Forecast Container</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg,#eef2f7,#dfe9f3);
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    .box{
        background:white;
        padding:28px;
        border-radius:14px;
        width:420px;
        box-shadow:0 8px 20px rgba(0,0,0,0.12);
    }

    h2{
        text-align:center;
        margin-bottom:18px;
    }

    .input-group{
        display:flex;
        gap:10px;
        align-items:center;
    }

    input{
        padding:10px;
        width:80px;
        border:1px solid #ccc;
        border-radius:6px;
        text-align:center;
    }

    button{
        padding:10px 12px;
        border:none;
        border-radius:6px;
        cursor:pointer;
        font-weight:600;
    }

    .btn-run{
        background:#2563eb;
        color:white;
        flex:1;
    }

    .btn-clear{
        background:#ef4444;
        color:white;
        width:100%;
        margin-top:10px;
    }

    button:hover{
        opacity:0.9;
    }

    table{
        width:100%;
        margin-top:16px;
        border-collapse:collapse;
        font-size:14px;
    }

    th, td{
        border-bottom:1px solid #eee;
        padding:10px;
        text-align:center;
    }

    th{
        background:#f8fafc;
    }

    tr:hover{
        background:#f1f5f9;
    }

    #result{
        margin-top:10px;
    }
</style>
</head>

<body>

<div class="box">

    <h2>Dự báo container</h2>

    <div class="input-group">
        <input type="number" id="n" value="6" min="1">
        <button class="btn-run" onclick="forecast()">Dự báo</button>
    </div>

    <button class="btn-clear" onclick="clearResult()">
        Xóa kết quả
    </button>

    <div id="result"></div>

</div>

<script>

async function forecast(){

    const n = document.getElementById("n").value;

    const res = await fetch(`/forecast/?n=${n}`);
    const data = await res.json();

    let html = `
        <table>
            <tr>
                <th>Tháng</th>
                <th>Dự báo</th>
            </tr>
    `;

    data.predictions.forEach(p => {
        html += `
            <tr>
                <td>${p.month}</td>
                <td>${p.forecast}</td>
            </tr>
        `;
    });

    html += `</table>`;

    document.getElementById("result").innerHTML = html;
}

function clearResult(){
    document.getElementById("result").innerHTML = "";
}

</script>

</body>
</html>
